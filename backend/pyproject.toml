[project]
name = "chordpro"
version = "0.1.0"
description = "Convert text-based PDF song sheets to ChordPro"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "reportlab>=4.2",
    "httpx>=0.27",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF's SWIG-generated extension emits spurious DeprecationWarnings on
    # Python 3.13 (e.g. "builtin type SwigPyPacked has no __module__ attribute").
    # They are import-time noise from a third-party C extension, not defects in
    # this project, and would otherwise pollute an otherwise clean test run.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
